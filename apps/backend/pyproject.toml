[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aughome-backend"
version = "0.1.0"
description = "AugHome IDE Intelligence Backend powered by augagent and FastAPI"
readme = "README.md"
authors = [{ name = "Augmencord" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "augagent>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
